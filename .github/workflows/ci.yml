name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: A4/package-lock.json

      - name: Install dependencies
        working-directory: A4
        run: npm ci

      - name: Build application
        working-directory: A4
        run: npm run build

      - name: Run tests
        working-directory: A4
        run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/a4-todo-app:latest ./A4
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/a4-todo-app:latest

      - name: Deploy to Render
        run: |
          echo "Deploying to Render..."
          curl -X POST "${{ secrets.RENDER_A4_DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}'
        continue-on-error: true

      - name: Workflow summary
        if: always()
        run: |
          echo "## A4 CI/CD Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: completed in \`A4/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ secrets.DOCKERHUB_USERNAME }}/a4-todo-app:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Render: deploy webhook triggered" >> $GITHUB_STEP_SUMMARY
