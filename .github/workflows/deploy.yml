name: CI/CD - Build, Push to Docker Hub, and Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build & Push Docker Image
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest ./A3
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest

      # 4. Deploy to Render.com (via webhook)
      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}'
        continue-on-error: true

      - name: Workflow Summary
        if: always()
        run: |
          echo "## CI/CD Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker image**: \`${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Render deploy**: webhook triggered (if secret is configured)" >> $GITHUB_STEP_SUMMARY
